name: Deploy project

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_COLYSEUS_URL: https://colyseus.ivins.id.au
        run: npm run build

      - name: Build backend
        working-directory: backend
        run: npm run build
